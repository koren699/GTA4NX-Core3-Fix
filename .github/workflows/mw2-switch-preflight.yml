name: MW2 Switch - ARM64 preflight NRO

on:
  push:
    branches:
      - mw2-switch-prototype
    paths:
      - 'mw2-switch/**'
      - '.github/workflows/mw2-switch-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preflight:
    name: Build Horizon / libnx diagnostic (not MW2)
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "DEVKITPRO=$DEVKITPRO"
          ls -ld "$DEVKITPRO"/libnx "$DEVKITPRO"/devkitA64 || true
          export DEVKITA64="$DEVKITPRO/devkitA64"
          export PATH="$DEVKITA64/bin:$PATH"
          test -f "$DEVKITPRO/libnx/switch_rules"
          command -v aarch64-none-elf-gcc
      - name: Build NRO
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITA64="$DEVKITPRO/devkitA64"
          export PATH="$DEVKITA64/bin:$PATH"
          make -C mw2-switch -j2
          test -s mw2-switch/mw2-switch-preflight.nro
          ls -lh mw2-switch/mw2-switch-preflight.nro
      - name: Upload NRO and ELF
        uses: actions/upload-artifact@v4
        with:
          name: mw2-switch-preflight-arm64
          path: |
            mw2-switch/mw2-switch-preflight.nro
            mw2-switch/mw2-switch-preflight.elf
          if-no-files-found: error
          retention-days: 14
